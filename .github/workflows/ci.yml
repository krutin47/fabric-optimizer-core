# Pull-request fast path (handbook §65, §110): locked restore, build with warnings as errors, the full test suite,
# and a deterministic smoke run of the CLI whose plans are re-checked by the independent validator.
# Actions are pinned to reviewed commits; the workflow has read-only permissions and no secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main, master, dev, uat]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results
      - name: Optimise and re-validate the spec example (deterministic)
        run: |
          dotnet run --project src/DreamGlass.Optimizer.Cli --configuration Release --no-build -- optimize samples/spec-example.json --deterministic --work 2500 --out ci-result.json
          dotnet run --project src/DreamGlass.Optimizer.Cli --configuration Release --no-build -- validate samples/spec-example.json ci-result.json
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results
          retention-days: 14
